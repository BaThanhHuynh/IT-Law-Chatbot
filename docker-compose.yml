
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_it_law
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  chatbot:
    build: .
    container_name: it_law_chatbot
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://host.docker.internal:7687
      - EMBEDDING_MODEL=/app/models/law_v2_model_20260505_1418
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      - .:/app
      - ./models:/app/models
    restart: always
