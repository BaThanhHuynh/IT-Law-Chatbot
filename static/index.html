<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITL Assistant</title>
    <meta name="description" content="Chatbot tư vấn Luật Công nghệ thông tin Việt Nam sử dụng AI và Knowledge Graph">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=1.25">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo-text" onclick="window.location.reload()" style="cursor: pointer;" title="Làm mới trang">ITL Assistant</h1>
                <button class="btn-close-sidebar" id="btnCloseSidebar" title="Đóng sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="sidebar-actions">
                <button class="btn-new-chat-full" id="btnNewChat" title="Cuộc hội thoại mới">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>Cuộc trò chuyện mới</span>
                </button>
                <div class="sidebar-search">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchConversations" placeholder="Tìm cuộc trò chuyện..." autocomplete="off" />
                </div>
            </div>
            <div class="sidebar-conversations" id="conversationList">
                <div class="conversation-empty">
                    <p>Chưa có cuộc hội thoại nào</p>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="tech-badge">
                    <span class="badge">RAG</span>
                    <span class="badge">GraphRAG</span>
                    <span class="badge">Gemini</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <button class="btn-toggle-sidebar" id="btnToggleSidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="header-title">
                    <h2 id="chatTitle"></h2>
                </div>

                <button class="btn-theme-toggle" id="btnThemeToggle" title="Chuyển chế độ sáng/tối">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>

            </header>

            <!-- Chat Area -->
            <div class="chat-wrapper">
                <div class="chat-area" id="chatArea">
                    <!-- Welcome Screen -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <h2>Chào Thành!</h2>
                        <p>Tôi là chatbot tư vấn luật CNTT. Tôi có thể giúp gì cho bạn hôm nay?</p>
                        <div class="suggestion-cards">
                            <button class="suggestion-card"
                                onclick="sendSuggestion('Những hành vi nào bị nghiêm cấm trong lĩnh vực CNTT?')">
                                <span class="suggestion-icon"></span>
                                <span>Hành vi bị nghiêm cấm trong CNTT</span>
                            </button>
                            <button class="suggestion-card"
                                onclick="sendSuggestion('Quyền sở hữu trí tuệ trong CNTT được bảo vệ như thế nào?')">
                                <span class="suggestion-icon"></span>
                                <span>Bảo vệ quyền sở hữu trí tuệ CNTT</span>
                            </button>
                            <button class="suggestion-card"
                                onclick="sendSuggestion('Thương mại điện tử được quy định như thế nào?')">
                                <span class="suggestion-icon"></span>
                                <span>Quy định về thương mại điện tử</span>
                            </button>
                            <button class="suggestion-card"
                                onclick="sendSuggestion('Cơ quan nhà nước có nghĩa vụ gì trên môi trường mạng?')">
                                <span class="suggestion-icon"></span>
                                <span>Nghĩa vụ của cơ quan nhà nước</span>
                            </button>
                        </div>
                    </div>

                    <!-- Messages container -->
                    <div class="messages-container" id="messagesContainer" style="display:none;">
                    </div>
                </div>


            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Nhập câu hỏi về Luật Công nghệ thông tin..." rows="1"
                        maxlength="2000"></textarea>
                    <button class="btn-send" id="btnSend" title="Gửi">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13" />
                            <polygon points="22 2 15 22 11 13 2 9 22 2" />
                        </svg>
                    </button>
                </div>
                <p class="input-disclaimer">AI có thể mắc sai sót. Vui lòng kiểm tra lại các thông tin quan trọng.</p>
            </div>
        </main>
    </div>

    <!-- Source Detail Modal -->
    <div class="source-modal-overlay" id="sourceModal">
        <div class="source-modal">
            <div class="source-modal-header">
                <div>
                    <h3 class="source-modal-title" id="sourceModalTitle"></h3>
                    <span class="source-modal-subtitle" id="sourceModalSubtitle"></span>
                </div>
                <button class="source-modal-close" id="sourceModalClose" title="Đóng">&times;</button>
            </div>
            <div class="source-modal-body" id="sourceModalBody"></div>
        </div>
    </div>

    <script src="/js/app.js?v=1.25"></script>
</body>

</html>
